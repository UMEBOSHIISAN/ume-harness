<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">What UME explains</title>
  <desc id="desc">Illustrative only. The host owns permission decisions.</desc>
  <style>
    .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202b38; }
    .label { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202b38; }
    .body { font: 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    .small { font: 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
  </style>
  <rect width="720" height="980" fill="#f8fafc"/>
  <text class="title" x="360" y="58" text-anchor="middle">What UME explains</text>
  <g><title>Organize work and decisions</title>
  <rect x="45" y="110" width="630" height="215" rx="24" fill="#e6eef9" stroke="#315f9f" stroke-width="4"/>
  <text class="label" x="360" y="162" text-anchor="middle">Pre-work preview</text>
  <text class="body" x="360" y="215" text-anchor="middle">Proposed work and questions</text>
<text class="body" x="360" y="249" text-anchor="middle">No operation is executed</text>
</g><g><title>The host owns permission decisions</title>
  <rect x="45" y="355" width="630" height="215" rx="24" fill="#fff0d7" stroke="#b56817" stroke-width="4"/>
  <text class="label" x="360" y="407" text-anchor="middle">PermissionRequest</text>
  <text class="body" x="360" y="460" text-anchor="middle">Add Japanese context</text>
<text class="body" x="360" y="494" text-anchor="middle">Decide in the host prompt</text>
</g><g><title>Failure stays incomplete</title>
  <rect x="45" y="600" width="630" height="215" rx="24" fill="#fde8e8" stroke="#b93838" stroke-width="4"/>
  <text class="label" x="360" y="652" text-anchor="middle">PostToolUseFailure</text>
  <text class="body" x="360" y="705" text-anchor="middle">Work is incomplete</text>
<text class="body" x="360" y="739" text-anchor="middle">Partial changes are unknown</text>
<text class="body" x="360" y="773" text-anchor="middle">Raw errors are omitted</text>
</g>
  <text class="small" x="360" y="910" text-anchor="middle">Illustrative only. The host owns permission decisions.</text>
</svg>
