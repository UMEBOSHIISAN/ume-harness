<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
  <title id="title">Responsibility split for humans and AI sharing work</title>
  <desc id="desc">The current public releases have no automatic runtime bridge. The dashed connection is not implemented.</desc>
  <style>
    .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202b38; }
    .label { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202b38; }
    .state { font: 700 20px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #16705a; }
    .body { font: 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    .small { font: 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
    .legend { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
  </style>
  <rect width="720" height="1120" fill="#f8fafc"/>
  <text class="title" x="360" y="58" text-anchor="middle">Responsibility split for humans and AI sharing work</text>
  <rect x="60" y="92" width="600" height="108" rx="22" fill="#fff0d7" stroke="#b56817" stroke-width="4"/>
  <text class="body" x="360" text-anchor="middle"><tspan x="360" y="141">Human: holds the purpose</tspan><tspan x="360" y="169">and decides what to entrust</tspan></text>
  <path d="M360 200 V240" stroke="#315f9f" stroke-width="5"/><path d="M350 226 L360 243 L370 226" fill="#315f9f"/>

  <rect x="45" y="245" width="630" height="235" rx="26" fill="#e6eef9" stroke="#315f9f" stroke-width="5"/>
  <text class="state" x="75" y="282">CURRENT</text>
  <text class="label" x="360" y="318" text-anchor="middle">UME-HARNESS</text>
  <text class="body" x="360" y="365" text-anchor="middle">Organize ambiguous Japanese intent</text>
<text class="body" x="360" y="405" text-anchor="middle">Visible scope / confirmation</text>
<text class="body" x="360" y="445" text-anchor="middle">Local-work preview</text>

  <g data-role="bridge">
    <path d="M360 480 V615" stroke="#7356a8" stroke-width="5" stroke-dasharray="14 12"/><path d="M350 600 L360 618 L370 600" fill="#7356a8"/>
    <rect x="60" y="518" width="600" height="64" rx="18" fill="#eee8fb" stroke="#7356a8" stroke-width="3" stroke-dasharray="12 10"/>
    <text class="state" x="360" y="558" text-anchor="middle">DIRECTION / NOT_SHIPPED</text>
  </g>

  <rect x="45" y="620" width="630" height="235" rx="26" fill="#dcf1e9" stroke="#16705a" stroke-width="5"/>
  <text class="state" x="75" y="657">CURRENT</text>
  <text class="label" x="360" y="693" text-anchor="middle">Mothership</text>
  <text class="body" x="360" y="740" text-anchor="middle">Freeze one concrete external action</text>
<text class="body" x="360" y="780" text-anchor="middle">Check the human decision</text>
<text class="body" x="360" y="820" text-anchor="middle">Consume once in one ledger history</text>

  <path d="M360 855 V878 H190 V900" stroke="#16705a" stroke-width="5" fill="none"/><path d="M180 886 L190 903 L200 886" fill="#16705a"/>
  <rect data-role="external" x="40" y="905" width="300" height="92" rx="20" fill="#fff" stroke="#7356a8" stroke-width="4"/>
  <rect data-role="external" x="380" y="905" width="300" height="92" rx="20" fill="#fff" stroke="#237e91" stroke-width="4"/>
  <text class="body" x="190" text-anchor="middle"><tspan x="190" y="946">Separately configured</tspan><tspan x="190" y="974">executor</tspan></text>
  <text class="body" x="530" text-anchor="middle"><tspan x="530" y="946">Separate verification</tspan><tspan x="530" y="974">path</tspan></text>
  <path d="M340 951 H375" stroke="#237e91" stroke-width="4"/><path d="M365 941 L380 951 L365 961" fill="#237e91"/>
  <text class="small" x="360" y="1016" text-anchor="middle">The current public releases have no automatic runtime bridge.</text>
  <text class="small" x="360" y="1044" text-anchor="middle">The dashed connection is not implemented.</text>
  <text class="legend" x="360" text-anchor="middle"><tspan x="360" y="1070">Solid = implemented now</tspan><tspan x="360" y="1091">Dashed = not connected</tspan><tspan x="360" y="1112">Outline = separately configured</tspan></text>
</svg>
