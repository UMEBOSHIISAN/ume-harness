name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify release identity
        run: python scripts/health_check.py --installed-dir . --identity-only --json
      - name: Run public test suite
        run: python -m pytest -q -p no:cacheprovider tests ux/japanese-human-layer/tests
